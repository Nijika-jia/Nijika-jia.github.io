name: Generate Collections

on:
  push:
    branches:
      - main
    paths:
      - data/collections.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      - name: Generate collection files
        run: npm run collections:generate

      - name: Commit generated files
        run: |
          if git diff --quiet -- pages/collections; then
            echo "No generated collection changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/collections
          git commit -m "chore: generate collection files"
          git push
