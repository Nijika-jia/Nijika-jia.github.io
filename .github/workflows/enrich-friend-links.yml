name: Enrich Friend Links

on:
  push:
    branches:
      - main
    paths:
      - public/friends/links.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enrich friend links
        run: pnpm friends:enrich

      - name: Commit enriched links
        run: |
          if git diff --quiet -- public/friends/links.json; then
            echo "No friend link changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/friends/links.json
          git commit -m "chore: enrich friend links"
          git push
