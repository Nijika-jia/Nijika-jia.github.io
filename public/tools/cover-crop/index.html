<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>16:9 封面裁剪</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --panel: #ffffff;
      --border: #dfe3ec;
      --text: #1d2021;
      --muted: #6b7280;
      --primary: #3384db;
      --primary-hover: #2b72c0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --panel: #1c1f24;
        --border: #2e333b;
        --text: #e8eaed;
        --muted: #9aa0aa;
        --primary: #65a8f0;
        --primary-hover: #7cb7f5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .app {
      width: min(960px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }
    header h1 { margin: 0 0 .4rem; font-size: 1.6rem; }
    header p { margin: 0 0 1.6rem; color: var(--muted); }
    .drop {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      min-height: 240px;
      padding: 2rem;
      border: 2px dashed var(--border);
      border-radius: 14px;
      background: var(--panel);
      color: var(--muted);
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, color .2s, background .2s;
    }
    .drop:hover, .drop.dragover {
      border-color: var(--primary);
      color: var(--text);
    }
    .drop strong { color: var(--text); font-size: 1.05rem; }
    .drop span { font-size: .9rem; }
    .editor { display: flex; flex-direction: column; gap: 1rem; }
    .stage {
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgb(0 0 0 / .18);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: grab;
      touch-action: none;
    }
    canvas:active { cursor: grabbing; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .9rem 1.2rem;
      padding: 1rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }
    .toolbar label {
      display: flex;
      align-items: center;
      gap: .5rem;
      color: var(--muted);
      font-size: .92rem;
    }
    input[type="range"] { width: 140px; accent-color: var(--primary); }
    select, button {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .42rem .7rem;
    }
    button {
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    button.primary {
      margin-left: auto;
      color: #fff;
      background: var(--primary);
      border-color: transparent;
      font-weight: 600;
    }
    button.primary:hover { background: var(--primary-hover); }
    button.primary:disabled { opacity: .55; cursor: default; }
    button.ghost:hover { border-color: var(--primary); }
    .hint { margin: 0; color: var(--muted); font-size: .88rem; }
    .meta { font-variant-numeric: tabular-nums; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>16:9 封面裁剪</h1>
      <p>图片只在浏览器本地处理，不会上传。裁好后下载，再上传到 Pages CMS 的封面字段。</p>
    </header>

    <div id="drop" class="drop" role="button" tabindex="0">
      <strong>拖入图片，或点击选择</strong>
      <span>也支持直接粘贴剪贴板里的图片</span>
    </div>
    <input id="file" type="file" accept="image/*" hidden>

    <section id="editor" class="editor" hidden>
      <div class="stage">
        <canvas id="preview"></canvas>
      </div>
      <div class="toolbar">
        <label>缩放
          <input id="zoom" type="range" min="1" max="4" step="0.01" value="1">
        </label>
        <label>输出
          <select id="output">
            <option value="1920">1920 × 1080</option>
            <option value="1280" selected>1280 × 720</option>
            <option value="960">960 × 540</option>
            <option value="640">640 × 360</option>
          </select>
        </label>
        <button id="reset" class="ghost" type="button">换个图片</button>
        <button id="download" class="primary" type="button">下载 16:9 封面</button>
      </div>
      <p class="hint">
        拖动图片调整取景，滚轮或滑块缩放。<span id="meta" class="meta"></span>
      </p>
    </section>
  </div>

  <script>
    const CW = 1280
    const CH = 720

    const drop = document.getElementById('drop')
    const fileInput = document.getElementById('file')
    const editor = document.getElementById('editor')
    const canvas = document.getElementById('preview')
    const ctx = canvas.getContext('2d')
    const zoomInput = document.getElementById('zoom')
    const outputSelect = document.getElementById('output')
    const resetButton = document.getElementById('reset')
    const downloadButton = document.getElementById('download')
    const meta = document.getElementById('meta')

    canvas.width = CW
    canvas.height = CH

    let image = null
    let base = 1
    let zoom = 1
    let offsetX = 0
    let offsetY = 0
    let dragging = false
    let lastX = 0
    let lastY = 0

    function dimensions() {
      const scale = base * zoom
      return { width: image.naturalWidth * scale, height: image.naturalHeight * scale }
    }

    function clampOffsets() {
      const { width, height } = dimensions()
      offsetX = Math.min(0, Math.max(CW - width, offsetX))
      offsetY = Math.min(0, Math.max(CH - height, offsetY))
    }

    function center() {
      const { width, height } = dimensions()
      offsetX = (CW - width) / 2
      offsetY = (CH - height) / 2
      clampOffsets()
    }

    function draw() {
      ctx.clearRect(0, 0, CW, CH)
      if (!image) return
      const { width, height } = dimensions()
      ctx.drawImage(image, offsetX, offsetY, width, height)
    }

    function updateMeta() {
      const { width } = dimensions()
      const size = Number(outputSelect.value)
      meta.textContent = `原图 ${image.naturalWidth}×${image.naturalHeight}，画面缩放 ${Math.round(width / CW * 100)}%，导出 ${size}×${size * 9 / 16}`
    }

    function setZoom(next) {
      const before = dimensions()
      const centerX = (CW / 2 - offsetX) / before.width
      const centerY = (CH / 2 - offsetY) / before.height
      zoom = Math.min(4, Math.max(1, next))
      const after = dimensions()
      offsetX = CW / 2 - centerX * after.width
      offsetY = CH / 2 - centerY * after.height
      clampOffsets()
      draw()
      updateMeta()
    }

    function loadImage(blob) {
      if (!blob || !blob.type.startsWith('image/')) return
      const url = URL.createObjectURL(blob)
      const next = new Image()
      next.onload = () => {
        URL.revokeObjectURL(url)
        image = next
        base = Math.max(CW / image.naturalWidth, CH / image.naturalHeight)
        zoom = 1
        zoomInput.value = '1'
        center()
        draw()
        updateMeta()
        drop.hidden = true
        editor.hidden = false
      }
      next.onerror = () => URL.revokeObjectURL(url)
      next.src = url
    }

    function pickFile(file) {
      loadImage(file)
    }

    drop.addEventListener('click', () => fileInput.click())
    drop.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault()
        fileInput.click()
      }
    })
    fileInput.addEventListener('change', () => {
      if (fileInput.files && fileInput.files[0]) pickFile(fileInput.files[0])
      fileInput.value = ''
    })

    ;['dragenter', 'dragover'].forEach(type => {
      drop.addEventListener(type, (event) => {
        event.preventDefault()
        drop.classList.add('dragover')
      })
    })
    ;['dragleave', 'drop'].forEach(type => {
      drop.addEventListener(type, () => drop.classList.remove('dragover'))
    })
    drop.addEventListener('drop', (event) => {
      event.preventDefault()
      const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0]
      if (file) pickFile(file)
    })

    window.addEventListener('paste', (event) => {
      const items = event.clipboardData && event.clipboardData.items
      if (!items) return
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          const file = item.getAsFile()
          if (file) {
            pickFile(file)
            event.preventDefault()
          }
          break
        }
      }
    })

    zoomInput.addEventListener('input', () => setZoom(Number(zoomInput.value)))
    outputSelect.addEventListener('change', updateMeta)

    canvas.addEventListener('pointerdown', (event) => {
      if (!image) return
      dragging = true
      lastX = event.clientX
      lastY = event.clientY
      canvas.setPointerCapture(event.pointerId)
    })
    canvas.addEventListener('pointermove', (event) => {
      if (!dragging || !image) return
      const rect = canvas.getBoundingClientRect()
      const scaleX = CW / rect.width
      const scaleY = CH / rect.height
      offsetX += (event.clientX - lastX) * scaleX
      offsetY += (event.clientY - lastY) * scaleY
      lastX = event.clientX
      lastY = event.clientY
      clampOffsets()
      draw()
    })
    function endDrag(event) {
      dragging = false
      if (event && event.pointerId != null && canvas.hasPointerCapture(event.pointerId))
        canvas.releasePointerCapture(event.pointerId)
    }
    canvas.addEventListener('pointerup', endDrag)
    canvas.addEventListener('pointercancel', endDrag)

    canvas.addEventListener('wheel', (event) => {
      if (!image) return
      event.preventDefault()
      const factor = event.deltaY < 0 ? 1.06 : 0.94
      setZoom(zoom * factor)
      zoomInput.value = String(zoom)
    }, { passive: false })

    resetButton.addEventListener('click', () => {
      image = null
      editor.hidden = true
      drop.hidden = false
      fileInput.click()
    })

    downloadButton.addEventListener('click', () => {
      if (!image) return
      const width = Number(outputSelect.value)
      const height = width * 9 / 16
      const output = document.createElement('canvas')
      output.width = width
      output.height = height
      const outCtx = output.getContext('2d')
      const scale = width / CW
      const { width: drawWidth, height: drawHeight } = dimensions()
      outCtx.drawImage(
        image,
        offsetX * scale,
        offsetY * scale,
        drawWidth * scale,
        drawHeight * scale,
      )
      output.toBlob((blob) => {
        if (!blob) return
        const link = document.createElement('a')
        link.href = URL.createObjectURL(blob)
        link.download = `cover-${width}x${height}.jpg`
        link.click()
        setTimeout(() => URL.revokeObjectURL(link.href), 1000)
      }, 'image/jpeg', 0.92)
    })
  </script>
</body>
</html>
