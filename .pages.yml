# Pages CMS configuration for Nijikajia.
# Documentation: https://pagescms.org/docs/

media:
  - name: post-images
    label: 文章图片
    input: public/posts
    output: /posts
    rename: safe
    categories: [image]

  - name: album-images
    label: 相册图片
    input: public/albums
    output: /albums
    rename: safe
    categories: [image]

  - name: site-assets
    label: 站点静态图片
    input: public
    output: /
    rename: safe
    categories: [image]

settings:
  content:
    merge: true
  commit:
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} -> {newPath}"

content:
  - name: posts
    label: 文章
    description: 编辑 pages/posts 下的 Markdown 文章和 Frontmatter。
    type: collection
    path: pages/posts
    format: yaml-frontmatter
    subfolders: true
    filename: "{primary}.md"
    view:
      fields: [title, date, categories, tags, draft]
      primary: title
      sort: [date, updated, title]
      search: [title, categories, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 发布日期
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss"
      - name: updated
        label: 更新日期
        type: date
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss"
      - name: categories
        label: 分类
        type: string
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 草稿
        type: boolean
        default: false
      - name: layout
        label: 布局
        type: string
        default: post
      - name: type
        label: 文章类型
        type: string
      - name: top
        label: 置顶权重
        type: number
        default: 0
      - name: excerpt
        label: 自定义摘要
        type: text
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          media: post-images
          rename: safe

  - name: pages
    label: 独立页面
    description: 关于、项目、追番和我の推等固定页面。
    type: group
    items:
      - name: about
        label: 关于我
        type: file
        path: pages/about/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: object
            fields:
              - name: zh-CN
                label: 中文
                type: string
              - name: en
                label: 英文
                type: string
          - name: layout
            label: 布局
            type: string
            default: post
          - name: tags
            label: 标签
            type: string
            list: true
          - name: copyright
            label: 显示版权
            type: boolean
            default: false
          - name: body
            label: 正文
            type: rich-text
            options:
              format: markdown
              media: post-images
              rename: safe

      - name: about-site
        label: 关于站点
        type: file
        path: pages/about/site.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: object
            fields:
              - name: zh-CN
                label: 中文
                type: string
              - name: en
                label: 英文
                type: string
          - name: body
            label: 正文
            type: rich-text
            options:
              format: markdown
              media: post-images

      - name: projects
        label: 小项目
        description: 编辑项目分类和项目卡片。
        type: file
        path: pages/projects/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: object
            fields:
              - name: zh-CN
                label: 中文
                type: string
              - name: en
                label: 英文
                type: string
          - name: color
            label: 主题色
            type: string
          - name: nav
            label: 显示导航
            type: boolean
            default: false
          - name: comment
            label: 启用评论
            type: boolean
            default: false
          - name: aside
            label: 显示侧栏
            type: boolean
            default: false
          - name: layout
            label: 布局
            type: string
            default: projects
          - name: projects
            label: 项目分类
            type: object
            fields:
              - name: game
                label: 游戏
                type: object
                fields:
                  - name: title
                    label: 分类标题
                    type: string
                  - name: emoji
                    label: Emoji
                    type: string
                  - name: collection
                    label: 项目列表
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: "{name}"
                    fields:
                      - name: name
                        label: 名称
                        type: string
                        required: true
                      - name: desc
                        label: 描述
                        type: text
                      - name: color
                        label: 卡片颜色
                        type: string
                      - name: gradient
                        label: 使用渐变
                        type: boolean
                        default: false
                      - name: url
                        label: 在线地址
                        type: string
                      - name: github
                        label: GitHub 地址
                        type: string
                      - name: emoji
                        label: 图标
                        type: string
                      - name: textColor
                        label: 文字颜色
                        type: string
              - name: tools
                label: 工具
                type: object
                fields:
                  - name: title
                    label: 分类标题
                    type: string
                  - name: emoji
                    label: Emoji
                    type: string
                  - name: collection
                    label: 项目列表
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: "{name}"
                    fields:
                      - name: name
                        label: 名称
                        type: string
                        required: true
                      - name: desc
                        label: 描述
                        type: text
                      - name: color
                        label: 卡片颜色
                        type: string
                      - name: gradient
                        label: 使用渐变
                        type: boolean
                        default: false
                      - name: url
                        label: 在线地址
                        type: string
                      - name: github
                        label: GitHub 地址
                        type: string
                      - name: emoji
                        label: 图标
                        type: string
                      - name: textColor
                        label: 文字颜色
                        type: string
              - name: plugins
                label: VS Code 插件
                type: object
                fields:
                  - name: title
                    label: 分类标题
                    type: string
                  - name: emoji
                    label: Emoji
                    type: string
                  - name: collection
                    label: 项目列表
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: "{name}"
                    fields:
                      - name: name
                        label: 名称
                        type: string
                        required: true
                      - name: desc
                        label: 描述
                        type: text
                      - name: color
                        label: 卡片颜色
                        type: string
                      - name: gradient
                        label: 使用渐变
                        type: boolean
                        default: false
                      - name: url
                        label: 在线地址
                        type: string
                      - name: github
                        label: GitHub 地址
                        type: string
                      - name: emoji
                        label: 图标
                        type: string
                      - name: textColor
                        label: 文字颜色
                        type: string
              - name: Steam
                label: Steam 创意工坊
                type: object
                fields:
                  - name: title
                    label: 分类标题
                    type: string
                  - name: emoji
                    label: Emoji
                    type: string
                  - name: collection
                    label: 项目列表
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: "{name}"
                    fields:
                      - name: name
                        label: 名称
                        type: string
                        required: true
                      - name: desc
                        label: 描述
                        type: text
                      - name: color
                        label: 卡片颜色
                        type: string
                      - name: gradient
                        label: 使用渐变
                        type: boolean
                        default: false
                      - name: url
                        label: 在线地址
                        type: string
                      - name: github
                        label: GitHub 地址
                        type: string
                      - name: emoji
                        label: 图标
                        type: string
                      - name: textColor
                        label: 文字颜色
                        type: string

      - name: bangumi
        label: 追番页面
        type: file
        path: pages/bangumi/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: object
            fields:
              - name: zh-CN
                label: 中文
                type: string
              - name: en
                label: 英文
                type: string
          - name: keywords
            label: 关键词
            type: string
          - name: description
            label: 页面描述
            type: text
          - name: aside
            label: 显示侧栏
            type: boolean
            default: false
          - name: body
            label: 正文
            type: rich-text
            options:
              format: markdown
              media: post-images

      - name: girls
        label: 我の推
        type: file
        path: pages/girls/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: string
            required: true
          - name: color
            label: 主题色
            type: string
          - name: nav
            label: 显示导航
            type: boolean
            default: false
          - name: toc
            label: 显示目录
            type: boolean
            default: false
          - name: comment
            label: 启用评论
            type: boolean
            default: true
          - name: aside
            label: 显示侧栏
            type: boolean
            default: false
          - name: body
            label: 正文
            type: rich-text
