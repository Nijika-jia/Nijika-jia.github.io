# Pages CMS configuration for Nijikajia.
# Documentation: https://pagescms.org/docs/

media:
  - name: post-images
    label: 文章图片
    input: public/posts
    output: /posts
    rename: safe
    categories: [image]

  - name: album-images
    label: 相册图片
    input: public/albums
    output: /albums
    rename: safe
    categories: [image]

  - name: site-assets
    label: 站点静态图片
    input: public
    output: /
    rename: safe
    categories: [image]

settings:
  content:
    merge: true
  commit:
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} -> {newPath}"

content:
  - name: posts
    label: 文章
    description: 编辑 pages/posts 下的 Markdown 文章和 Frontmatter。
    type: collection
    path: pages/posts
    format: yaml-frontmatter
    subfolders: true
    filename: "{primary}.md"
    view:
      fields: [title, date, categories, tags, draft]
      primary: title
      sort: [date, updated, title]
      search: [title, categories, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: cover
        label: 封面图
        description: 可从文章图片库选择或上传新图片。
        type: image
        options:
          media: post-images
      - name: body
        label: 正文
        description: 在 Editor 模式下可从工具栏插入图片，也可以拖拽或粘贴图片。
        type: rich-text
        options:
          format: markdown
          media: post-images
          rename: safe
      - name: date
        label: 发布日期
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss"
      - name: updated
        label: 更新日期
        type: date
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss"
      - name: categories
        label: 分类
        type: string
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 草稿
        type: boolean
        default: false
      - name: layout
        label: 布局
        type: string
        default: post
      - name: type
        label: 文章类型
        type: string
      - name: top
        label: 置顶权重
        type: number
        default: 0
      - name: excerpt
        label: 自定义摘要
        type: text

  - name: pages
    label: 独立页面
    description: 关于、项目、追番和我の推等固定页面。
    type: group
    items:
      - name: about
        label: 关于我
        type: file
        path: pages/about/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: object
            fields:
              - name: zh-CN
                label: 中文
                type: string
              - name: en
                label: 英文
                type: string
          - name: layout
            label: 布局
            type: string
            default: post
          - name: tags
            label: 标签
            type: string
            list: true
          - name: copyright
            label: 显示版权
            type: boolean
            default: false
          - name: body
            label: 正文
            type: rich-text
            options:
              format: markdown
              media: post-images
              rename: safe

      - name: about-site
        label: 关于站点
        type: file
        path: pages/about/site.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: object
            fields:
              - name: zh-CN
                label: 中文
                type: string
              - name: en
                label: 英文
                type: string
          - name: body
            label: 正文
            type: rich-text
            options:
              format: markdown
              media: post-images

      - name: projects
        label: 小项目
        description: 编辑项目分类和项目卡片。
        type: file
        path: pages/projects/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: object
            fields:
              - name: zh-CN
                label: 中文
                type: string
              - name: en
                label: 英文
                type: string
          - name: color
            label: 主题色
            type: string
          - name: nav
            label: 显示导航
            type: boolean
            default: false
          - name: comment
            label: 启用评论
            type: boolean
            default: false
          - name: aside
            label: 显示侧栏
            type: boolean
            default: false
          - name: layout
            label: 布局
            type: string
            default: projects
          - name: projects
            label: 项目分类
            type: object
            list:
              min: 1
              collapsible:
                collapsed: false
                summary: "{title}"
            fields:
              - name: id
                label: 分类 ID
                description: 用于页面切换，使用小写英文、数字和短横线，例如 web-tools。
                type: string
                required: true
                pattern:
                  regex: "^[a-z0-9][a-z0-9-]*$"
                  message: 只能使用小写英文、数字和短横线。
              - name: title
                label: 分类标题
                type: string
                required: true
              - name: emoji
                label: Emoji
                type: string
              - name: collection
                label: 项目列表
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{name}"
                fields:
                  - name: name
                    label: 名称
                    type: string
                    required: true
                  - name: desc
                    label: 描述
                    type: text
                  - name: color
                    label: 卡片颜色
                    type: string
                  - name: gradient
                    label: 使用渐变
                    type: boolean
                    default: false
                  - name: url
                    label: 在线地址
                    type: string
                  - name: github
                    label: GitHub 地址
                    type: string
                  - name: emoji
                    label: 图标
                    type: string
                  - name: textColor
                    label: 文字颜色
                    type: string

      - name: bangumi
        label: 追番页面
        type: file
        path: pages/bangumi/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: object
            fields:
              - name: zh-CN
                label: 中文
                type: string
              - name: en
                label: 英文
                type: string
          - name: keywords
            label: 关键词
            type: string
          - name: description
            label: 页面描述
            type: text
          - name: aside
            label: 显示侧栏
            type: boolean
            default: false
          - name: body
            label: 正文
            type: rich-text
            options:
              format: markdown
              media: post-images

      - name: girls
        label: 我の推
        type: file
        path: pages/girls/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: string
            required: true
          - name: color
            label: 主题色
            type: string
          - name: nav
            label: 显示导航
            type: boolean
            default: false
          - name: toc
            label: 显示目录
            type: boolean
            default: false
          - name: comment
            label: 启用评论
            type: boolean
            default: true
          - name: aside
            label: 显示侧栏
            type: boolean
            default: false
          - name: body
            label: 正文
            type: rich-text
            options:
              format: markdown
              media: post-images

  - name: albums
    label: 相册
    description: 维护相册首页和各图集。
    type: group
    items:
      - name: albums-index
        label: 相册首页
        type: file
        path: pages/ablums/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: object
            fields:
              - name: zh-CN
                label: 中文
                type: string
              - name: en
                label: 英文
                type: string
          - name: nav
            label: 显示导航
            type: boolean
            default: false
          - name: comment
            label: 启用评论
            type: boolean
            default: false
          - name: aside
            label: 显示侧栏
            type: boolean
            default: false
          - name: layout
            label: 布局
            type: string
            default: albums
          - name: albums
            label: 相册列表
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - name: url
                label: 页面地址
                type: string
                required: true
              - name: cover
                label: 封面
                type: image
                options:
                  media: album-images
              - name: caption
                label: 标题
                type: string
              - name: desc
                label: 描述
                type: text

      - name: album-galleries
        label: 图集页面
        type: collection
        path: pages/ablums
        format: yaml-frontmatter
        exclude: [index.md]
        operations:
          create: false
          rename: false
          delete: false
        view:
          fields: [title]
          primary: title
        fields:
          - name: title
            label: 标题
            type: object
            fields:
              - name: zh-CN
                label: 中文
                type: string
              - name: en
                label: 英文
                type: string
          - name: nav
            label: 显示导航
            type: boolean
            default: false
          - name: comment
            label: 启用评论
            type: boolean
            default: true
          - name: aside
            label: 显示侧栏
            type: boolean
            default: false
          - name: medium_zoom
            label: 图片缩放
            type: boolean
            default: true
          - name: layout
            label: 布局
            type: string
            default: gallery
          - name: photos
            label: 照片
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "照片 {index}"
            fields:
              - name: src
                label: 图片
                type: image
                required: true
                options:
                  media: album-images
              - name: caption
                label: 标题
                type: string
              - name: desc
                label: 描述
                type: text

  - name: collections
    label: 合集
    description: 维护合集入口和合集内文章。
    type: group
    items:
      - name: collections-index
        label: 合集入口
        type: file
        path: pages/collections/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: object
            fields:
              - name: zh-CN
                label: 中文
                type: string
              - name: en
                label: 英文
                type: string
          - name: layout
            label: 布局
            type: string
            default: collections
          - name: icon
            label: 图标
            type: string
          - name: collections
            label: 合集 ID
            type: string
            list: true

      - name: collection-posts
        label: 合集文章
        type: collection
        path: pages/collections
        format: yaml-frontmatter
        subfolders: true
        exclude: [index.md]
        view:
          layout: tree
          fields: [title, date, tags, draft]
          primary: title
          sort: [date, title]
          search: [title, tags, categories]
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: 标题
            type: string
            required: true
          - name: layout
            label: 布局
            type: string
            default: post
          - name: cover
            label: 封面图
            type: image
            options:
              media: post-images
          - name: date
            label: 发布日期
            type: date
            options:
              time: true
              format: "yyyy-MM-dd HH:mm:ss"
          - name: tags
            label: 标签
            type: string
            list: true
          - name: categories
            label: 分类
            type: string
          - name: draft
            label: 草稿
            type: boolean
            default: false
          - name: body
            label: 正文
            type: rich-text
            options:
              format: markdown
              media: post-images
              rename: safe

      - name: lanqiao-collection
        label: 蓝桥合集配置
        description: 编辑 pages/collections/lanqiao/index.ts 中的合集条目。
        type: file
        path: pages/collections/lanqiao/index.ts
        format: code

  - name: system-pages
    label: 系统页面
    description: 归档、分类、标签和 404 页面的布局与开关。
    type: group
    items:
      - name: archives-page
        label: 归档页
        type: file
        path: pages/archives/index.md
        format: yaml-frontmatter
        fields:
          - name: layout
            label: 布局
            type: string
            default: archives
          - name: nav
            label: 显示导航
            type: boolean
            default: false
          - name: comment
            label: 启用评论
            type: boolean
            default: false
          - name: aside
            label: 显示侧栏
            type: boolean
            default: false

      - name: categories-page
        label: 分类页
        type: file
        path: pages/categories/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: object
            fields:
              - name: zh-CN
                label: 中文
                type: string
              - name: en
                label: 英文
                type: string
          - name: layout
            label: 布局
            type: string
            default: categories
          - name: icon
            label: 图标
            type: string
          - name: nav
            label: 显示导航
            type: boolean
            default: false
          - name: toc
            label: 显示目录
            type: boolean
            default: false
          - name: comment
            label: 启用评论
            type: boolean
            default: false
          - name: aside
            label: 显示侧栏
            type: boolean
            default: false

      - name: tags-page
        label: 标签页
        type: file
        path: pages/tags/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: object
            fields:
              - name: zh-CN
                label: 中文
                type: string
              - name: en
                label: 英文
                type: string
          - name: layout
            label: 布局
            type: string
            default: tags
          - name: icon
            label: 图标
            type: string
          - name: nav
            label: 显示导航
            type: boolean
            default: false
          - name: toc
            label: 显示目录
            type: boolean
            default: false
          - name: comment
            label: 启用评论
            type: boolean
            default: false
          - name: aside
            label: 显示侧栏
            type: boolean
            default: false

      - name: page-404
        label: 404 页面
        type: file
        path: pages/404.md
        format: code

  - name: friends
    label: 友人帐
    type: group
    items:
      - name: friend-links
        label: 友链列表
        description: 直接维护 public/friends/links.json。
        type: file
        path: public/friends/links.json
        format: json
        list: true
        fields:
          - name: url
            label: 网址
            type: string
            required: true
          - name: avatar
            label: 头像 URL（可留空）
            description: 留空时会从友链网址自动获取 favicon，并在失败时使用默认头像。
            type: string
          - name: name
            label: 名称
            type: string
          - name: blog
            label: 博客名称
            type: string
          - name: desc
            label: 描述
            type: text
          - name: color
            label: 主题色
            type: string
          - name: email
            label: 邮箱
            type: string

      - name: friend-page
        label: 友人帐页面
        description: 编辑友人帐页面文字、Frontmatter 和留言说明。
        type: file
        path: pages/links/index.md
        format: code

  - name: configuration
    label: 站点配置
    type: group
    items:
      - name: site-settings
        label: 站点设置（表单）
        description: 编辑 data/site.json 中的站点信息、作者、社交链接和功能开关。
        type: file
        path: data/site.json
        format: json
        fields:
          - name: url
            label: 站点 URL
            type: string
            required: true
          - name: lang
            label: 默认语言
            type: string
            required: true
          - name: languages
            label: 支持语言
            type: string
            list: true
          - name: subtitle
            label: 副标题
            type: string
          - name: favicon
            label: 站点图标 URL
            type: string
          - name: timezone
            label: 时区
            type: string
            description: 例如 Asia/Shanghai。
          - name: author
            label: 作者信息
            type: object
            fields:
              - name: name
                label: 名称
                type: string
              - name: avatar
                label: 头像 URL
                type: string
              - name: status
                label: 在线状态
                type: object
                fields:
                  - name: emoji
                    label: Emoji
                    type: string
                  - name: message
                    label: 状态文字
                    type: string
              - name: intro
                label: 简介
                type: text
          - name: encrypt
            label: 内容加密
            type: object
            fields:
              - name: enable
                label: 启用
                type: boolean
                default: false
          - name: frontmatter
            label: 默认文章字段
            type: object
            fields:
              - name: time_warning
                label: 更新时间警告
                type: boolean
                default: false
          - name: statistics
            label: 阅读统计
            type: object
            fields:
              - name: enable
                label: 启用
                type: boolean
                default: true
              - name: readTime
                label: 阅读时间
                type: object
                fields:
                  - name: speed
                    label: 阅读速度
                    type: object
                    fields:
                      - name: cn
                        label: 中文（字/分钟）
                        type: number
                      - name: en
                        label: 英文（词/分钟）
                        type: number
          - name: search
            label: 站内搜索
            type: object
            fields:
              - name: enable
                label: 启用
                type: boolean
                default: true
              - name: provider
                label: 搜索方式
                type: select
                options:
                  values:
                    - name: fuse
                      label: 本地 Fuse 搜索
                    - name: local
                      label: 本地 MiniSearch
                    - name: algolia
                      label: Algolia
                    - name: engine
                      label: 外部搜索引擎
          - name: comment
            label: 评论区
            type: object
            fields:
              - name: enable
                label: 启用
                type: boolean
                default: true
          - name: lastUpdated
            label: 显示最后更新时间
            type: boolean
            default: true
          - name: orderBy
            label: 文章排序
            type: select
            options:
              values:
                - name: date
                  label: 发布日期
                - name: updated
                  label: 更新时间
          - name: excerpt
            label: 自动摘要
            type: object
            fields:
              - name: auto
                label: 自动生成
                type: boolean
                default: true
              - name: length
                label: 摘要长度
                type: number
          - name: social
            label: 社交链接
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                label: 名称
                type: string
                required: true
              - name: link
                label: 链接
                type: string
                required: true
              - name: icon
                label: 图标
                type: string
              - name: color
                label: 颜色
                type: string
          - name: sponsor
            label: 赞助
            type: object
            fields:
              - name: enable
                label: 启用
                type: boolean
                default: true
              - name: title
                label: 标题
                type: string
              - name: description
                label: 描述
                type: text
              - name: methods
                label: 赞助方式
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{name}"
                fields:
                  - name: name
                    label: 名称
                    type: string
                    required: true
                  - name: url
                    label: 二维码或链接
                    type: string
                    required: true
                  - name: color
                    label: 颜色
                    type: string
                  - name: icon
                    label: 图标
                    type: string
          - name: pageSize
            label: 每页文章数
            type: number
          - name: mediumZoom
            label: 图片缩放
            type: object
            fields:
              - name: enable
                label: 启用
                type: boolean
                default: true
          - name: vanillaLazyload
            label: 图片懒加载
            type: object
            fields:
              - name: enable
                label: 启用
                type: boolean
                default: true
          - name: codeHeightLimit
            label: 代码块最大高度
            type: number

      - name: theme-settings
        label: 主题设置（表单）
        description: 编辑 data/theme.json 中的导航、背景、页面卡片、页脚和主题效果。
        type: file
        path: data/theme.json
        format: json
        fields:
          - name: banner
            label: 首页横幅
            type: object
            fields:
              - name: enable
                label: 启用
                type: boolean
                default: true
              - name: title
                label: 标题
                type: string
              - name: cloud
                label: 云层动画
                type: object
                fields:
                  - name: enable
                    label: 启用
                    type: boolean
                    default: true
              - name: duration
                label: 动画时长
                type: number
          - name: outlineTitle
            label: 文章目录标题
            type: string
          - name: nav
            label: 顶部导航
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{text}"
            fields:
              - name: text
                label: 文字
                type: string
                required: true
              - name: link
                label: 链接
                type: string
                required: true
              - name: icon
                label: 图标
                type: string
          - name: bg_image
            label: 背景图片
            type: object
            fields:
              - name: enable
                label: 启用
                type: boolean
                default: true
              - name: url
                label: 浅色背景 URL
                type: string
              - name: dark
                label: 深色背景 URL
                type: string
              - name: opacity
                label: 透明度
                type: number
          - name: pages
            label: 首页快捷页面
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{nameKey}"
            fields:
              - name: nameKey
                label: 文案键
                type: select
                options:
                  values:
                    - name: pages.categories
